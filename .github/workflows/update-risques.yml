name: Mise à jour Risques (vigilance HARMONIE, non officielle)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Retraiter même si rien n'a changé côté source (utile après un déploiement de code)"
        type: boolean
        default: false
  schedule:
    # 03:50, 04:50, 05:50, 08:50, 11:50, 14:50 et 17:50 UTC, soit 05:50,
    # 06:50, 07:50, 10:50, 13:50, 16:50 et 19:50 à Paris pendant l'heure
    # d'été. Le créneau 03:50 UTC a été ajouté pour que le basculement J0
    # (journée météo 5h→5h, cf. DAY_BOUNDARY_HOUR) soit effectif dès 5h50 à
    # Paris plutôt que d'attendre le run de 6h50.
    # Le délai de 40 min après la publication HARMONIE à :10 laisse les
    # données source arriver avant le calcul des risques.
    - cron: "50 3,4,5,8,11,14,17 * * *"

permissions:
  contents: write

concurrency:
  group: risques-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Calculer les risques à partir des données HARMONIE publiées
        id: build
        run: |
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if python scripts/update_risques.py \
              --harmonie-base-url "https://raw.githubusercontent.com/alertesmeteo-hub/harmonie/data" \
              --output-dir build/national \
              --current-metadata-url "https://raw.githubusercontent.com/${{ github.repository }}/data/risques.json" \
              ${{ inputs.force && '--force' || '' }} 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done
          if test -f build/national/risques.json; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier la publication
        if: steps.build.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("build/national/risques.json").read_text(encoding="utf-8"))
          assert payload["status"] == "ok"
          assert len(payload["departments"]) >= 80
          assert len(payload["hazards"]) == 11
          assert set(payload["hazard_levels"].keys()) == set(payload["hazards"].keys())
          sample = next(iter(payload["departments"].values()))
          assert len(sample["daily"]) >= 1
          print(
              f"Validation OK : {len(payload['departments'])} départements, "
              f"run {payload.get('run_time', '?')}"
          )
          PY

      - name: Publier sur la branche data
        if: steps.build.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -R build/national/. "$publish_dir/"
          git init -b data "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add .
          git -C "$publish_dir" commit -m "Mise à jour Risques"
          git -C "$publish_dir" push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:data
